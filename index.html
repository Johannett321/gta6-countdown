<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA VI Countdown</title>
<meta name="description" content="Fan-made countdown to Grand Theft Auto VI — November 19, 2026. Built for an always-on office display.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff3c8e;
    --hot: #ff2d6f;
    --orange: #ff8a3d;
    --gold: #ffd166;
    --purple: #7b2ff7;
    --teal: #19d3c5;
    --night: #0b0420;
    --glass: rgba(20, 6, 45, 0.45);
    --glass-edge: rgba(255, 255, 255, 0.14);
    --ticker-h: 6vh;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* Kiosk display: one screen, no scrolling, no mouse pointer. */
  body {
    background: var(--night);
    color: #fff;
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
    cursor: none;
    user-select: none;
  }

  /* ---------- Vice City sunset scene (fixed background) ---------- */
  .scene {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: linear-gradient(180deg,
      #0e0326 0%, #2a0a4f 22%, #6b1470 38%, #c2266f 50%,
      #ff5f6d 57%, #ffb36b 63%, #2a0f45 63.2%, #12062b 78%, var(--night) 100%);
  }
  .stars { position: absolute; inset: 0 0 50% 0; }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: .7; animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: .1; } }

  .sun {
    position: absolute; left: 50%; top: 63%;
    width: min(62vw, 70vh); aspect-ratio: 1;
    transform: translate(-50%, -62%);
    border-radius: 50%;
    background: linear-gradient(180deg, var(--gold) 0%, var(--orange) 45%, var(--pink) 80%, var(--purple) 100%);
    box-shadow: 0 0 120px 40px rgba(255, 90, 120, .35);
    -webkit-mask: linear-gradient(180deg, #000 52%, transparent 52%, transparent 55%, #000 55%, #000 62%,
      transparent 62%, transparent 66%, #000 66%, #000 72%, transparent 72%, transparent 77%, #000 77%,
      #000 82%, transparent 82%, transparent 88%, #000 88%);
            mask: linear-gradient(180deg, #000 52%, transparent 52%, transparent 55%, #000 55%, #000 62%,
      transparent 62%, transparent 66%, #000 66%, #000 72%, transparent 72%, transparent 77%, #000 77%,
      #000 82%, transparent 82%, transparent 88%, #000 88%);
  }
  .water { position: absolute; left: 0; right: 0; top: 63%; bottom: 0; overflow: hidden; }
  .reflection {
    position: absolute; left: 50%; top: 0; width: min(50vw, 56vh); height: 60%;
    transform: translateX(-50%);
    background: repeating-linear-gradient(180deg, rgba(255, 140, 90, .55) 0 4px, transparent 4px 14px);
    -webkit-mask: radial-gradient(ellipse at top, #000 20%, transparent 70%);
            mask: radial-gradient(ellipse at top, #000 20%, transparent 70%);
    filter: blur(1px);
    animation: shimmer 4s ease-in-out infinite;
  }
  @keyframes shimmer { 50% { transform: translateX(-50%) scaleX(1.12); opacity: .7; } }
  .grid {
    position: absolute; inset: 20% -50% -20% -50%;
    background:
      linear-gradient(rgba(255, 60, 142, .35) 1px, transparent 1px) 0 0 / 100% 40px,
      linear-gradient(90deg, rgba(25, 211, 197, .25) 1px, transparent 1px) 0 0 / 60px 100%;
    transform: perspective(300px) rotateX(60deg);
    transform-origin: top;
    animation: drive 2.5s linear infinite;
    -webkit-mask: linear-gradient(180deg, transparent, #000 40%);
            mask: linear-gradient(180deg, transparent, #000 40%);
  }
  @keyframes drive { to { background-position: 0 40px, 0 0; } }

  .palm { position: absolute; bottom: 30%; fill: #0a0318; filter: drop-shadow(0 0 1px rgba(255,80,140,.4)); }
  .palm.left  { left: -40px;  height: 62vh; transform-origin: bottom center; animation: sway 7s ease-in-out infinite; }
  .palm.left2 { left: 13vw;   height: 34vh; bottom: 34%; opacity: .85; animation: sway 9s ease-in-out infinite reverse; }
  .palm.right { right: -50px; height: 68vh; transform: scaleX(-1); animation: swayR 8s ease-in-out infinite; }
  @keyframes sway  { 50% { rotate: 1.6deg; } }
  @keyframes swayR { 50% { transform: scaleX(-1) rotate(1.6deg); } }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(5, 0, 15, .75) 100%);
  }

  /* ---------- Foreground: everything fits in one screen ---------- */
  main {
    position: relative; z-index: 1;
    height: calc(100vh - var(--ticker-h) - 2vh);
    max-width: 1600px; margin: 0 auto;
    padding: 3vh 16px 1vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .presents {
    letter-spacing: .5em; text-transform: uppercase; font-weight: 600;
    font-size: clamp(10px, 1.4vh, 18px); opacity: .75; margin-bottom: 1.5vh;
  }

  .logo { display: inline-flex; flex-direction: column; align-items: center; }
  .logo .gta {
    font-family: Anton, Impact, sans-serif; font-size: clamp(12px, 2.3vh, 32px);
    letter-spacing: .12em; line-height: 1.05; text-align: left;
    background: #fff; color: #120530; padding: .4em .6em; border-radius: 3px;
    margin-bottom: -.25em; position: relative; z-index: 2; transform: rotate(-3deg);
  }
  .logo .vi {
    font-family: Anton, Impact, sans-serif;
    font-size: min(26vw, 26vh); line-height: .9;
    background: linear-gradient(160deg, var(--gold) 0%, var(--orange) 25%, var(--pink) 55%, var(--purple) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 rgba(10, 3, 24, .6)) drop-shadow(0 0 40px rgba(255, 60, 142, .55));
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { filter: drop-shadow(0 6px 0 rgba(10,3,24,.6)) drop-shadow(0 0 70px rgba(255,138,61,.7)); } }

  .tagline {
    font-family: Yellowtail, cursive; font-size: min(6vw, 6.5vh);
    color: #fff; margin-top: .5vh; min-height: 1.3em;
    text-shadow: 0 0 12px var(--pink), 0 0 30px var(--hot);
    transform: rotate(-4deg);
    transition: opacity .6s;
  }

  .countdown {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: min(2vw, 2.5vh); width: min(92vw, 120vh); margin: 3vh 0 2vh;
  }
  .unit {
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    border-radius: 2vh;
    padding: 2.2vh 6px 1.6vh;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .1);
    position: relative; overflow: hidden;
  }
  .unit::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, var(--teal), var(--pink), var(--orange));
  }
  .num {
    font-family: Anton, Impact, sans-serif; font-size: min(10vw, 14vh); line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow: 0 0 18px rgba(255, 60, 142, .8), 0 0 40px rgba(255, 60, 142, .4);
    display: inline-block;
  }
  .num.tick { animation: tick .35s ease-out; }
  @keyframes tick { from { transform: translateY(-14%) scale(1.08); color: var(--gold); } }
  .label {
    margin-top: .8vh; font-size: clamp(10px, 1.6vh, 22px); font-weight: 800;
    letter-spacing: .3em; text-transform: uppercase; color: var(--teal);
  }

  .release { font-weight: 600; font-size: clamp(14px, 2.4vh, 32px); }
  .release b { color: var(--gold); }
  .platforms { display: flex; gap: 1vh; justify-content: center; flex-wrap: wrap; margin-top: 1.2vh; }
  .chip {
    font-size: clamp(10px, 1.4vh, 18px); font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    padding: .6vh 1.2vh; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .25); background: rgba(0, 0, 0, .25);
  }

  .progress-wrap { width: min(92vw, 120vh); margin-top: 2.5vh; text-align: left; }
  .progress-head {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: clamp(10px, 1.5vh, 20px); font-weight: 600; opacity: .85; margin-bottom: .8vh;
  }
  .bar { height: 1.2vh; min-height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .1); overflow: hidden; border: 1px solid var(--glass-edge); }
  .fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--teal), var(--pink), var(--orange), var(--gold));
    box-shadow: 0 0 16px var(--pink);
    transition: width 1s linear;
  }

  /* Rotating fact line (replaces scrollable sections) */
  .fact {
    margin-top: 2vh; font-size: clamp(12px, 2vh, 28px); max-width: min(92vw, 120vh);
    min-height: 2.6em; opacity: .9; transition: opacity .8s;
  }
  .fact b { color: var(--gold); font-family: Yellowtail, cursive; font-weight: 400; font-size: 1.5em; margin-right: .3em; }

  /* Ticker pinned to the bottom edge */
  .ticker {
    position: fixed; left: -10px; right: -10px; bottom: 2.5vh; z-index: 1;
    height: var(--ticker-h); display: flex; align-items: center;
    overflow: hidden; white-space: nowrap;
    background: linear-gradient(90deg, var(--hot), var(--orange));
    color: #120530; font-family: Anton, Impact, sans-serif; letter-spacing: .08em;
    font-size: clamp(14px, 2.6vh, 36px); transform: rotate(-1.2deg);
    box-shadow: 0 8px 30px rgba(255, 45, 111, .45);
  }
  .ticker-track { display: inline-block; animation: scroll 50s linear infinite; }
  .ticker span { padding: 0 1.2em; }
  .ticker span::after { content: "★"; padding-left: 2.4em; }
  @keyframes scroll { to { transform: translateX(-50%); } }

  /* Release-day mode */
  body.launched .num { color: var(--gold); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- Background: Vice City sunset -->
<div class="scene" aria-hidden="true">
  <div class="stars" id="stars"></div>
  <div class="sun"></div>
  <div class="water">
    <div class="grid"></div>
    <div class="reflection"></div>
  </div>
  <svg class="palm left" viewBox="0 0 300 520"><use href="#palmShape"/></svg>
  <svg class="palm left2" viewBox="0 0 300 520"><use href="#palmShape"/></svg>
  <svg class="palm right" viewBox="0 0 300 520"><use href="#palmShape"/></svg>
  <div class="vignette"></div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="palmShape">
      <path d="M150 520 C 150 420, 140 330, 160 250 C 172 205, 175 170, 168 130 L 178 128 C 188 170, 186 210, 174 255 C 156 330, 164 420, 168 520 Z"/>
      <path d="M172 128 C 120 90, 60 95, 10 140 C 70 110, 120 115, 168 138 Z"/>
      <path d="M172 128 C 140 70, 90 45, 30 50 C 90 70, 130 95, 166 134 Z"/>
      <path d="M172 128 C 175 70, 160 30, 120 0 C 150 45, 160 85, 166 130 Z"/>
      <path d="M174 126 C 210 70, 250 50, 300 55 C 250 75, 215 100, 180 134 Z"/>
      <path d="M176 130 C 230 110, 270 130, 296 180 C 260 145, 225 135, 178 140 Z"/>
      <path d="M172 132 C 150 160, 120 200, 112 250 C 135 205, 155 175, 178 140 Z"/>
      <path d="M176 132 C 200 165, 215 205, 214 250 C 200 205, 188 175, 172 142 Z"/>
      <circle cx="172" cy="134" r="9"/>
    </g>
  </defs>
</svg>

<main>
  <div class="presents">Rockstar Games presents</div>

  <div class="logo" role="img" aria-label="Grand Theft Auto VI">
    <div class="gta">GRAND<br>THEFT<br>AUTO</div>
    <div class="vi">VI</div>
  </div>

  <div class="tagline" id="tagline">Welcome to Leonida</div>

  <div class="countdown">
    <div class="unit"><div class="num" id="d">--</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="h">--</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="m">--</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="s">--</div><div class="label">Seconds</div></div>
  </div>

  <p class="release">Arrives <b>Thursday, November 19, 2026</b></p>
  <div class="platforms">
    <span class="chip">PlayStation 5</span>
    <span class="chip">Xbox Series X|S</span>
  </div>

  <div class="progress-wrap">
    <div class="progress-head">
      <span>Wait survived since Trailer 1 (Dec 5, 2023)</span>
      <span id="pct">0%</span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <p class="fact" id="fact"></p>
</main>

<div class="ticker" aria-hidden="true">
  <div class="ticker-track" id="ticker"></div>
</div>

<script>
  // Launch: local midnight on Nov 19, 2026 (consoles unlock at midnight local time).
  const RELEASE = new Date(2026, 10, 19, 0, 0, 0);
  const TRAILER1 = new Date(2023, 11, 5, 0, 0, 0);

  const el = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const prev = {};
  const isLaunched = () => document.body.classList.contains("launched");

  function setNum(id, val) {
    if (prev[id] === val) return;
    prev[id] = val;
    const node = el(id);
    node.textContent = val;
    node.classList.remove("tick");
    void node.offsetWidth; // restart animation
    node.classList.add("tick");
  }

  function update() {
    const now = new Date();
    let diff = Math.max(0, RELEASE - now);

    const days = Math.floor(diff / 864e5); diff -= days * 864e5;
    const hrs  = Math.floor(diff / 36e5);  diff -= hrs * 36e5;
    const mins = Math.floor(diff / 6e4);   diff -= mins * 6e4;
    const secs = Math.floor(diff / 1e3);

    setNum("d", days); setNum("h", pad(hrs)); setNum("m", pad(mins)); setNum("s", pad(secs));

    const pct = Math.min(100, ((now - TRAILER1) / (RELEASE - TRAILER1)) * 100);
    el("fill").style.width = pct.toFixed(3) + "%";
    el("pct").textContent = pct.toFixed(4) + "%";

    if (now >= RELEASE && !isLaunched()) {
      document.body.classList.add("launched");
      el("tagline").textContent = "It's here. Go to Vice City.";
      el("fact").textContent = "Grand Theft Auto VI is out now on PlayStation 5 and Xbox Series X|S.";
      document.title = "GTA VI IS OUT";
    } else if (!isLaunched()) {
      document.title = `${days}d ${pad(hrs)}:${pad(mins)}:${pad(secs)} · GTA VI`;
    }
  }

  // Fade-swap helper for the rotating text lines
  function rotate(id, items, ms, render) {
    let i = 0;
    const node = el(id);
    render(node, items[0]);
    setInterval(() => {
      if (isLaunched()) return;
      node.style.opacity = 0;
      setTimeout(() => {
        i = (i + 1) % items.length;
        render(node, items[i]);
        node.style.opacity = "";
      }, 650);
    }, ms);
  }

  rotate("tagline",
    ["Welcome to Leonida", "Vice City awaits", "Hot together", "Love is a long road", "Only in Leonida", "See you in Vice City"],
    5000, (n, t) => { n.textContent = t; });

  rotate("fact", [
    ["Lucia Caminos", "Fresh out of the Leonida Penitentiary and done playing it safe."],
    ["Jason Duval", "Grew up around grifters and crooks, wanted an easy life — then he met Lucia."],
    ["Leonida", "Vice City, the Leonida Keys, Grassrivers, Port Gellhorn, Ambrosia and Mount Kalaga."],
    ["Trailer 1", "December 5, 2023 — set to Tom Petty's “Love Is a Long Road”."],
    ["Trailer 2", "May 6, 2025 — set to The Pointer Sisters' “Hot Together”."],
    ["Two delays", "Fall 2025 → May 26, 2026 → November 19, 2026. Almost there."],
  ], 9000, (n, [title, text]) => { n.innerHTML = `<b>${title}</b>${text}`; });

  // Ticker content (duplicated for a seamless loop)
  const tick = ["Vice City", "Leonida Keys", "Grassrivers", "Port Gellhorn", "Ambrosia", "Mount Kalaga",
                "Jason & Lucia", "November 19 2026", "PS5 · Xbox Series X|S"];
  el("ticker").innerHTML = [...tick, ...tick].map(t => `<span>${t}</span>`).join("");

  // Stars
  const stars = el("stars");
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 3) + "s";
    s.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
    stars.appendChild(s);
  }

  setInterval(update, 1000);
  update();
</script>
</body>
</html>
